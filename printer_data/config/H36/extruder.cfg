#####################################################################
##             H36 Extruder Motor
#####################################################################

################################################################################
## TMC Auto Tune
################################################################################

# [motor_constants siboor-14sth20-1004a]
# #Siboor BOM Voron Trident AWD
# resistance: 1.7
# inductance: 0.0015
# holding_torque: 0.12
# max_current: 0.95            # Was 1.88
# steps_per_revolution: 200

[autotune_tmc extruder]
motor: siboor-14sth20-1004a


################################################################################
## Extruder
################################################################################

[extruder]
step_pin: H36:PB9              # Step pin
dir_pin: H36:PC15              # Direction pin, "!" indicates logic inversion
enable_pin: !H36:PC14          # Enable pin, "!" indicates logic inversion
full_steps_per_rotation: 200         # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
microsteps: 16                       # Microsteps setting
gear_ratio: 50:17
rotation_distance:  12.67844805# 22.5
nozzle_diameter: 0.400               # Nozzle diameter
filament_diameter: 1.750             # Filament diameter
max_extrude_only_distance: 100.0
pid_kp=34.117
pid_ki=8.978
pid_kd=32.410
max_extrude_cross_section: 5         # For purge line
heater_pin: H36:PB13          # Heater pin
control: pid                         # Control method
min_temp: -20                        # Minimum temperature
max_temp: 350                        # Maximum temperature
min_extrude_temp: 170                # Minimum extrude temperature
pressure_advance: 0.04               # Pressure advance
pressure_advance_smooth_time: 0.040  # Pressure advance smooth time
sensor_type: PT1000                # Temperature sensor type
pullup_resistor: 2200
sensor_pin: H36:PA3            # Sensor pin

[tmc2209 extruder]
uart_pin: H36:PB6              # UART communication pin
interpolate: true                    # Enable 256 microstep interpolation
run_current: 0.60                    # Running current
sense_resistor: 0.110

#--------------------------------------------------------------------
[verify_heater extruder]             # Heater block temperature tolerance configuration
max_error: 120                       # Maximum error
check_gain_time: 120                 # Tolerance time
hysteresis: 50                       # Tolerance temperature
heating_gain: 2                      # Heating gain


#####################################################################
##                            Firmware Retract
#####################################################################

[firmware_retraction]
# G10 to retract and G11 to unrectract
retract_length: 0.5
# unretract_extra_length: 0
retract_speed: 40
unretract_speed: 40


[filament_switch_sensor toolhead_sensor_upper]
switch_pin: H36:PB3
pause_on_runout: False
runout_gcode:
    M117 Filament sensor 1 triggered
    RESPOND TYPE=error MSG="Filament sensor 1 triggered"
    runnout_init
insert_gcode:
    M117 Filament detected on sensor 1
    filament_load_init

[filament_switch_sensor toolhead_sensor_lower]
switch_pin: H36:PB4
pause_on_runout: False
runout_gcode:
    M117 Filament sensor 2 triggered
    RESPOND TYPE=error MSG="Filament sensor 2 triggered"
insert_gcode:
    M117 Filament detected on sensor 2
