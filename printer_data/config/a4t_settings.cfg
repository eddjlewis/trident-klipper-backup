#####################################################################################################
#  A4T Filament Loader - user settings
#
#  Edit this file. Leave a4t_loader.cfg alone unless you know what you are doing.
#  Keep this as your own copy (not a link) so updates never overwrite it. Any setting missing
#  from here - e.g. one added by a later update - uses the default from a4t_loader.cfg.
#  Project page: https://github.com/eddjlewis/a4t-filament-loader
#####################################################################################################
#
#  The WW-BMG for A4T "Dual Sensor" extruder has two microswitches in the filament path:
#
#        ECAS / PTFE
#            |
#     [ ENTRY sensor ]   upper switch, ABOVE the drive gears  -> "is there filament in the extruder?"
#            |
#     (( drive gears ))
#            |
#     [ GEAR sensor ]    lower switch, BELOW the drive gears  -> "has the extruder actually grabbed it?"
#            |
#         hotend
#
#  Both sensors are standard Klipper [filament_switch_sensor] sections. The loader reads them to
#  auto-grab filament on insert, confirm the gears have it, confirm an unload has really cleared the
#  gears, and to catch runouts during a print.



#####################################################################################################
#  Sensors - set your pins
#####################################################################################################
#  Check each switch with QUERY_FILAMENT_SENSOR SENSOR=a4t_entry (and a4t_gear): it must report
#  "filament detected" with filament in place. If it's backwards, add or remove the "!" on the pin.
#  The "^" enables the MCU pull-up, which is what a bare microswitch wired to signal+GND needs.

[filament_switch_sensor a4t_entry]
switch_pin: H36:PB3              # <--- upper (entry) switch pin
pause_on_runout: False                 # the loader handles pausing itself
insert_gcode: _LDR_ON_ENTRY_INSERT
runout_gcode: _LDR_ON_ENTRY_RUNOUT
event_delay: 1.0
#debounce_delay: 0.1                   # uncomment on Klipper builds that support it

[filament_switch_sensor a4t_gear]
switch_pin: H36:PB4            # <--- lower (gear) switch pin
pause_on_runout: False               # no runout_gcode: once a tail leaves the drive gears nothing pushes
                                     #   it further, so it sits across this switch - only the entry sensor
                                     #   can see a runout
event_delay: 1.0
#debounce_delay: 0.1                   # uncomment on Klipper builds that support it


#####################################################################################################
#  Loader settings
#####################################################################################################
[gcode_macro _LDR_CONFIG]
description: A4T filament loader settings (edit a4t_settings.cfg)

# --- Materials --------------------------------------------------------------------------------------
# [name, nozzle temp, bed temp]. Shown as buttons when loading/unloading. Add or remove freely.
variable_materials: [["PLA", 215, 60], ["PETG", 240, 80], ["ABS", 250, 100], ["ASA", 260, 105],
                     ["TPU", 230, 50], ["PC", 270, 110], ["PA", 280, 80]]
variable_temp_tolerance: 5          # start moving filament once the nozzle is within this many degC

# --- Geometry (mm) - measure these on your extruder -----------------------------------------------
variable_gear_sensor_to_nozzle: 55  # lower (gear) sensor switch point -> nozzle tip, along the path
variable_load_slowdown: 10          # stop the fast feed this far short of the nozzle, then purge slowly
variable_gear_release: 15           # after the tip clears the gear sensor, retract this much more so
                                    #   it's above the drive gears and can be pulled out by hand

# --- Grabbing new filament --------------------------------------------------------------------------
variable_autoload: True             # grab filament automatically when it's pushed past the entry sensor
variable_autoload_delay: 1.0        # s: wait after the entry sensor triggers before the gears turn
variable_grab_step: 2               # mm per step while feeding towards the gear sensor
variable_grab_max: 40               # mm: give up if the gear sensor hasn't triggered after this
variable_grab_speed: 10             # mm/s (cold FORCE_MOVE, so the nozzle doesn't need to be hot)
variable_grab_accel: 500            # mm/s^2
variable_stub_grab_distance: 25     # mm: blind feed used when an old tail is still sitting at the
                                    #   gear sensor (so the sensor can't confirm the new filament)

# --- Loading / purging ----------------------------------------------------------------------------
variable_load_speed: 15             # mm/s fast feed from the gear sensor towards the hotend
variable_purge_length: 60           # mm purged after loading
variable_purge_speed: 4             # mm/s purge speed (keep within your hotend's melt rate)
variable_purge_more_length: 30      # mm per "Purge more" press
variable_stub_extra_purge: 30       # mm extra purge when an old tail was pushed through ahead of the
                                    #   new filament (mid-print runout)
variable_purge_prompt: True         # ask "Is the colour clean?" after purging (Purge more / Retry)
variable_heat_bed_on_load: False    # also heat the bed to the material's bed temp when loading
variable_cooldown_after_load: True  # turn the hotend down after a standalone load...
variable_cooldown_temp: 0           #   ...to this temp (0 = off)
variable_pre_purge_gcode: ""        # gcode run before purging on a standalone (not paused) load,
                                    #   e.g. "G28 Z" or "PARK_OVER_BUCKET". Not run mid-print.
variable_post_purge_gcode: ""       # gcode run after a standalone load's purge, e.g. "CLEAN_NOZZLE"

# --- Unloading --------------------------------------------------------------------------------------
variable_tip_push: 5                # mm pushed before the tip-forming retract (softens the tip)
variable_tip_push_speed: 4          # mm/s
variable_tip_retract: 15            # mm fast retract out of the melt zone
variable_tip_retract_speed: 40      # mm/s
variable_tip_cool_time: 2000        # ms dwell to let the tip solidify
variable_unload_speed: 20           # mm/s for the rest of the unload
variable_unload_step: 5             # mm per step while retracting towards the gear sensor
variable_unload_seek_max: 60        # mm: give up if the gear sensor hasn't cleared after this
variable_cooldown_after_unload: True

# --- Runout / filament change ------------------------------------------------------------------------
variable_runout_enabled: True       # pause when the entry sensor runs out during a print
variable_runout_unload_tail: False # on runout, False = leave the short tail in and let the new filament
                                    #   push it through (no need to pull the PTFE off to fish it out).
                                    #   True = retract the tail first if the gears still have it.
variable_change_auto_unload: True   # on M600 / CHANGE_FILAMENT, unload straight away instead of asking
variable_auto_resume: True          # resume the print as soon as the new filament is purged

# --- Misc -----------------------------------------------------------------------------------------
variable_extruder: "extruder"       # extruder (and FORCE_MOVE stepper) name
variable_alert_gcode: ""            # run whenever the loader needs your attention, e.g. "M300"
variable_remember_material: True    # store the last material with SAVE_VARIABLE (needs [save_variables])
variable_poll_interval: 0.5         # s between sensor checks while waiting for you
variable_step_interval: 0.05        # s between feed/retract steps
gcode:
