################################################################################
##	                           Manta M8P 2.0 Config
################################################################################
## !!WARNING!!
## Drivers as plugged in left to right on the manta m8p v2 are as follows:
## x0, y0, z0, z1, z2, --, x1, y1
################################################################################


[include bed.cfg]
[include fans.cfg]
[include led.cfg]
[include steppers_xy.cfg]
#[include steppers_xy_sensorless.cfg]
[include steppers_z.cfg]


#-------------------------------------------------------------------------------
[temperature_sensor MantaM8P]
sensor_type: temperature_mcu


[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA7
min_temp: -20
max_temp: 100




# [gcode_button emergency_stop]
# pin: ^PB0
# debounce_delay: 0
# press_gcode:
#     M112




[gcode_macro WLED_PRESET]
gcode:
    {% set strip = params.STRIP|default("esp")|string %}
    {% set preset = params.PRESET|int %}
    {action_call_remote_method("set_wled_state",
        strip=strip,
        state=True,
        preset=preset)}


[gcode_button lighting_button]
pin: ^!host:gpiochip0/gpio16
debounce_delay: 0.05
press_gcode:
    RESPOND MSG="Daylight Toggle"
    DAYLIGHT_TOGGLE

[gcode_button homing_button]
pin: ^!host:gpiochip0/gpio26
debounce_delay: 0.05
press_gcode:
    RESPOND MSG="Homing button pressed"
    G28