[gcode_macro RUN_COORDINATE_PATH]
description: Move through a fixed coordinate path
gcode:
    {% set speed = params.SPEED|default(100)|float %}
    {% set accel = params.ACCEL|default(1000)|float %}
    {% set feedrate = speed * 60 %}
    {% set previous_accel = printer.toolhead.max_accel|float %}

    {% if speed <= 0 %}
        { action_raise_error("SPEED must be greater than zero") }
    {% endif %}

    {% if accel <= 0 %}
        { action_raise_error("ACCEL must be greater than zero") }
    {% endif %}

    {% if "x" not in printer.toolhead.homed_axes
          or "y" not in printer.toolhead.homed_axes
          or "z" not in printer.toolhead.homed_axes %}
        { action_raise_error("Printer must be homed before running RUN_COORDINATE_PATH") }
    {% endif %}

    SAVE_GCODE_STATE NAME=coordinate_path_state
    G90

    SET_VELOCITY_LIMIT ACCEL={accel}

       # Forward
    G1 X0   Y300 Z20 F{feedrate}
    G1 X300 Y300 Z20 F{feedrate}
    G1 X280 Y40  Z20 F{feedrate}
    G1 X280 Y0   Z20 F{feedrate}
    G1 X25  Y0   Z20 F{feedrate}
    G1 X25  Y40  Z20 F{feedrate}
    G1 X0   Y300 Z20 F{feedrate}

    # Reverse
    G1 X25  Y40  Z20 F{feedrate}
    G1 X25  Y0   Z20 F{feedrate}
    G1 X280 Y0   Z20 F{feedrate}
    G1 X280 Y40  Z20 F{feedrate}
    G1 X300 Y300 Z20 F{feedrate}
    G1 X0   Y300 Z20 F{feedrate}
    M400
    SET_VELOCITY_LIMIT ACCEL={previous_accel}
    RESTORE_GCODE_STATE NAME=coordinate_path_state



[gcode_macro SQUARE_XY_TEST]
description: Move to bed center, then draw 50mm square 10 times
variable_iterations: 40
variable_side: 150.0
variable_speed_mm_s: 100.0
variable_accel: 1000
gcode:
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    {action_raise_error("Home X and Y first")}
  {% endif %}

  {% set cx = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2.0 %}
  {% set cy = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2.0 %}
  {% set half = side / 2.0 %}
  {% set f = speed_mm_s * 60.0 %}
  {% set cfg_v = printer.configfile.settings.printer.max_velocity %}
  {% set cfg_a = printer.configfile.settings.printer.max_accel %}

  SAVE_GCODE_STATE NAME=SQUARE_TEST_STATE

  G90
  SET_VELOCITY_LIMIT VELOCITY={speed_mm_s} ACCEL={accel}
  G1 X{cx} Y{cy} F{f}        ; move to bed center
  G91

  {% for i in range(iterations) %}
    G1 X-{half} Y-{half} F{f}
    G1 X{side}         F{f}
    G1       Y{side}   F{f}
    G1 X-{side}        F{f}
    G1       Y-{side}  F{f}
    G1 X{half} Y{half} F{f}
  {% endfor %}

  G90
  G1 X{cx} Y{cy} F{f}        ; return to bed center
  RESTORE_GCODE_STATE NAME=SQUARE_TEST_STATE
  SET_VELOCITY_LIMIT VELOCITY={cfg_v} ACCEL={cfg_a}



